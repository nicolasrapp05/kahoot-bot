<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahoot Bot Controller Pro</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #1a1a2e; color: #eee; display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
        .container { background: #16213e; padding: 30px; border-radius: 12px; width: 100%; max-width: 650px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { margin-top: 0; color: #e94560; font-size: 1.5rem; }
        
        .status-bar { display: flex; justify-content: space-between; background: #0f3460; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; font-size: 0.9rem; color: #4ade80; border: 1px solid #2d3748; }
        
        label { display: block; margin: 12px 0 4px; font-size: 0.9rem; color: #aaa; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #0f3460; color: #fff; font-size: 1rem; }
        
        .row { display: flex; gap: 15px; margin-bottom: 10px;}
        .row > div { flex: 1; }
        
        .checkbox-group { display: flex; gap: 20px; margin: 15px 0; background: #1e1e30; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .checkbox-item { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #fff; font-size: 0.9rem; }
        .checkbox-item input { width: 18px; height: 18px; cursor: pointer; accent-color: #e94560; }
        .checkbox-item label { margin: 0; cursor: pointer; color: #fff; }

        .botoes { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        
        #btnIniciar { background: #e94560; color: #fff; }
        #btnParar { background: #e74c3c; color: #fff; width: 100%; font-size: 1.1rem; margin-bottom: 15px; display: none; }
        
        #log { margin-top: 20px; background: #0f0f1a; padding: 15px; border-radius: 6px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; border: 1px solid #333; }
        
        /* Painel de Respostas */
        #painelRespostas { display: none; margin-top: 20px; padding: 20px; background: #1e1e30; border-radius: 8px; border: 2px solid #e94560; text-align: center; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(233, 69, 96, 0); } 100% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0); } }
        #painelRespostas h2 { margin: 0 0 15px 0; color: #e94560; font-size: 1.2rem; }
        .grid-respostas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-resposta { padding: 15px; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; color: #fff; cursor: pointer; text-align: center; }
        .btn-resposta:hover { opacity: 0.8; transform: scale(1.02); }
        .btn-resposta[data-cor="0"] { background: #e21b3c; }
        .btn-resposta[data-cor="1"] { background: #1368ce; }
        .btn-resposta[data-cor="2"] { background: #d89e00; }
        .btn-resposta[data-cor="3"] { background: #26890c; }

        /* Painel de Fim de Jogo */
        #painelFim { display: none; margin-top: 20px; padding: 20px; background: #1e1e30; border-radius: 8px; border: 2px solid #4ade80; text-align: center; }
        #painelFim h2 { color: #4ade80; margin-top: 0; }
        .btn-fim { padding: 12px; margin: 5px; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; flex: 1;}
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Kahoot Bot Controller Pro</h1>
        
        <div class="status-bar">
            <span>🟢 Bots Ativos: <span id="statBots">0</span></span>
            <span>📊 Votos: <span id="statVotos">0</span></span>
            <span>❓ Perguntas: <span id="statPerguntas">0</span></span>
        </div>

        <!-- Botão de Limpar Sala (Fica visível apenas após iniciar) -->
        <button id="btnParar" onclick="limparSala()">🧹 Limpar Sala e Desconectar Bots</button>

        <!-- Div de Configurações -->
        <div id="configuracoes">
            <label>PIN da Sala</label>
            <input type="text" id="pin" placeholder="Ex: 1234567">
            
            <div class="row">
                <div>
                    <label>Quantidade Total de Bots</label>
                    <input type="number" id="quantidade" value="20" min="1" max="500">
                </div>
            </div>

            <div class="row">
                <div>
                    <label>Bots por vez (Bloco)</label>
                    <input type="number" id="tamanhoBloco" value="5" min="1" max="50">
                </div>
                <div>
                    <label>Intervalo entre Blocos (ms)</label>
                    <input type="number" id="intervaloEntrada" value="2000" min="500">
                </div>
            </div>

            <div class="checkbox-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="chkDelay">
                    <label for="chkDelay">🗣️ Delay Humano (Votos por bloco)</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="chkAutoPilot">
                    <label for="chkAutoPilot">🤖 Auto-Pilot (Bots escolhem sozinhos)</label>
                </div>
            </div>

            <div class="botoes" id="containerBotoes">
                <button id="btnIniciar" onclick="iniciar()">▶ Iniciar Bots</button>
            </div>
        </div>

        <!-- Painel de Respostas -->
        <div id="painelRespostas">
            <h2>⚠️ PERGUNTA ATIVA! Escolha a resposta:</h2>
            <p style="font-size: 0.85rem; color: #aaa; margin-top: -10px;">Escolha pela cor que está vendo na tela do jogo.</p>
            <div class="grid-respostas" id="gridRespostas"></div>
        </div>

        <!-- Painel de Fim de Jogo -->
        <div id="painelFim">
            <h2>🏁 O Jogo Acabou!</h2>
            <p>Os bots terminaram o quiz. O que você deseja fazer?</p>
            <div style="display: flex; gap: 10px;">
                <button class="btn-fim" style="background: #e74c3c; color: white;" onclick="limparSala()">Desconectar Todos</button>
                <button class="btn-fim" style="background: #444; color: white;" onclick="document.getElementById('painelFim').style.display='none'">Manter na Sala</button>
            </div>
        </div>

        <div id="log">Aguardando configuração...</div>
    </div>

    <script>
        const logEl = document.getElementById('log');
        const painelRespostas = document.getElementById('painelRespostas');
        const painelFim = document.getElementById('painelFim');
        const gridRespostas = document.getElementById('gridRespostas');

        function conectarLogs() {
            const fonte = new EventSource('/api/logs');
            fonte.onmessage = (e) => {
                const payload = JSON.parse(e.data);
                if (payload.tipo === 'log') {
                    logEl.textContent += '\n' + payload.mensagem;
                    logEl.scrollTop = logEl.scrollHeight;
                } else if (payload.tipo === 'nova_pergunta') {
                    painelFim.style.display = 'none';
                    mostrarBotoes(payload.opcoes);
                } else if (payload.tipo === 'stats') {
                    document.getElementById('statBots').textContent = payload.dados.botsAtivos;
                    document.getElementById('statVotos').textContent = payload.dados.votosEnviados;
                    document.getElementById('statPerguntas').textContent = payload.dados.perguntas;
                } else if (payload.tipo === 'fim_jogo') {
                    painelRespostas.style.display = 'none';
                    painelFim.style.display = 'block';
                }
            };
            fonte.onerror = () => { setTimeout(conectarLogs, 2000); };
        }
        conectarLogs();

        function mostrarBotoes(numOpcoes) {
            gridRespostas.innerHTML = '';
            const nomesCores = ["Vermelho (Triângulo)", "Azul (Losango)", "Amarelo (Círculo)", "Verde (Quadrado)"];
            for (let i = 0; i < numOpcoes; i++) {
                const btn = document.createElement('button');
                btn.className = 'btn-resposta';
                btn.dataset.cor = i;
                btn.textContent = nomesCores[i] || `Opção ${i+1}`;
                btn.onclick = () => enviarResposta(i);
                gridRespostas.appendChild(btn);
            }
            painelRespostas.style.display = 'block';
        }

        async function iniciar() {
            const pin = document.getElementById('pin').value.trim();
            const quantidade = parseInt(document.getElementById('quantidade').value);
            const tamanhoBloco = parseInt(document.getElementById('tamanhoBloco').value);
            const intervaloEntrada = parseInt(document.getElementById('intervaloEntrada').value);
            const autoPilot = document.getElementById('chkAutoPilot').checked;
            const delayHumano = document.getElementById('chkDelay').checked;
            
            if (!pin || !quantidade || !tamanhoBloco) return alert('Preencha todos os campos.');
            
            logEl.textContent = 'Conectando bots...';
            painelRespostas.style.display = 'none';
            painelFim.style.display = 'none';
            
            document.getElementById('configuracoes').style.display = 'none';
            document.getElementById('btnParar').style.display = 'block';
            
            try {
                await fetch('/api/iniciar', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ pin, quantidade, intervaloEntrada, tamanhoBloco, autoPilot, delayHumano }) 
                });
            } catch (e) { logEl.textContent += '\n❌ Erro ao conectar.'; }
        }

        async function enviarResposta(index) {
            painelRespostas.style.display = 'none';
            const delayHumano = document.getElementById('chkDelay').checked;
            const tamanhoBloco = parseInt(document.getElementById('tamanhoBloco').value);
            
            try {
                await fetch('/api/responder', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ indice: index, delayHumano, tamanhoBloco }) 
                });
            } catch (e) {}
        }

        async function limparSala() {
            if(!confirm("Tem certeza que deseja desconectar todos os bots?")) return;
            
            await fetch('/api/parar', { method: 'POST' });
            
            document.getElementById('configuracoes').style.display = 'block';
            document.getElementById('btnParar').style.display = 'none';
            
            painelRespostas.style.display = 'none';
            painelFim.style.display = 'none';
            logEl.textContent += '\n🧹 Sala limpa com sucesso.';
        }
    </script>
</body>
</html>
